project:
  type: website
  output-dir: docs
  preview: 
    port: 5555
    browser: true
    watch-inputs: true
    navigate: true

# title-block-banner: "#3C3E49"

website:
  title: "Edifofon"
#  description: "Edifofon is a research associate at The University of Melbourne Australia and Helpman Institute Abuja Nigeria"
  favicon: "/assets/icon.png"
  site-url: "https://edifofon.com"
  repo-url: "https://github.com/EdifofonA"
  back-to-top-navigation: true
  
  page-footer:
    left: |
      <span class="faux-block">{{< fa brands creative-commons >}} {{< var years >}} Edifofon Akpan</span>
    center: |
      <span class="faux-block">{{< fa brands orcid >}} <strong>ORCID</strong> [{{< var orcid >}}](https://orcid.org/{{< var orcid >}})</span>
    right: |
      <span class="faux-block">Made using {{< fa brands r-project >}} and [Quarto](https://quarto.org/)</span>
    background: light
  
  search: false
  #   location: navbar
  #   type: overlay
  
  navbar:
    pinned: true
    search: true
    background: light
    type: light
    logo: "assets/icon.png"

    left:
      - text: "About"
        href: "about/index.qmd"
      - text: "Reflections"
        href: "reflections/index.qmd"
      # - text: "Faith"
      #   href: "faith/index.qmd"    
      - text: "Research"
        href: "research/index.qmd"
      - text: "Learning"
        href: "learning/index.qmd"
      # - text: "Tools"
      #   href: "tools/index.qmd"
    
    right:
      - icon: envelope
        aria-label: email
        href: "mailto:edifofonakpan@gmail.com"
      - icon: github
        aria-label: github
        href: https://github.com/EdifofonA
      - icon: linkedin
        aria-label: linkedin
        href: https://www.linkedin.com/in/edifofon

format:
  html:
    theme: 
      - html/ath.scss
    toc: true
    grid:
      sidebar-width: 250px
      body-width: 850px
      margin-width: 250px
      gutter-width: 1.5rem
editor: visual

